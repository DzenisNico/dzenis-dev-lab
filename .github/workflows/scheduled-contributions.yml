      - name: Create scheduled commits
        env:
          COUNT: ${{ steps.plan.outputs.count }}
        run: |
          git config user.name "DzenisNico"
          git config user.email "Denis.Nikos@finoragroups.com"
          for i in $(seq 1 "$COUNT"); do
            TS="$(date -u +"%Y-%m-%d %H:%M UTC")"
            FILE="scheduled/log-${TS//[: ]/-}-$i.txt"
            mkdir -p scheduled
            {
              echo "Scheduled contribution"
              echo "Timestamp: $TS"
              echo "Item $i of $COUNT"
              echo "Trigger: ${{ github.event.schedule }}"
            } > "$FILE"
            git add "$FILE"
            git commit -m "Scheduled update $i/$COUNT ($TS)"
          done
          git push
